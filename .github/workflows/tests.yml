name: Runtime tests
on:
  push:
    branches: [main, features]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A new push to the pull request cancels the run on the commit it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    # The workflows are published with the branch (AarhusCosmology/client-f); they run only here.
    if: github.repository == 'AarhusCosmology/client'
    # The organisation's own runners, as CLASS++ uses: no GitHub-hosted minutes.
    runs-on: [self-hosted, linux, heavy]
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BEST_PATH: ${{ github.workspace }}/.test-dependencies/best
    steps:
      - uses: actions/checkout@v7
      # The runners' Python is Anaconda's 3.13, for which TensorFlow 2.19 has no wheel, and a
      # job cannot install system packages. So a conda-forge environment in RUNNER_TEMP (the
      # runner empties it after the job) with the pinned Python, Open MPI and mpi4py; the rest
      # comes from requirements-test.txt as before.
      - name: Create Python environment
        run: |
          CONDA=$(command -v conda || echo /opt/anaconda3/bin/conda)
          "$CONDA" create --yes --quiet --prefix "$RUNNER_TEMP/env" --override-channels -c conda-forge \
              python=3.10 openmpi "mpi4py>=4,<5"
          echo "$RUNNER_TEMP/env/bin" >> "$GITHUB_PATH"
          # Per-job caches: several jobs may share a runner machine.
          echo "MPLCONFIGDIR=$RUNNER_TEMP/mpl" >> "$GITHUB_ENV"
          echo "GETDIST_CONFIG=$RUNNER_TEMP/getdist.ini" >> "$GITHUB_ENV"
      - run: python -m pip install -r requirements-test.txt
      - uses: actions/checkout@v7
        with:
          repository: AndreasNygaard/best-inference
          ref: b5cd08b113fb77d4d243d596a4e8a42ac5503cad
          path: .test-dependencies/best
      # Use BEST's source plus explicit dependencies: its package metadata caps
      # numpy below CLiENT's pinned version. This combination is integration-tested.
      - run: python -m pip install -r requirements-test-optional.txt
      - run: python -m pip check
      - run: python -c 'from evidence.sampler import import_best; import_best(); import camb'
      - run: echo "cache_dir = $RUNNER_TEMP/getdist" > "$GETDIST_CONFIG"
      - run: python tests/run_mpi_smokes.py
        env:
          # A runner may have fewer free cores than ranks. These tiny two-rank
          # communication checks may share one; production launchers are unchanged.
          CLIENT_TEST_MPI_ARGS: --oversubscribe
      - run: python tests/pipeline_recovery_smoke.py
      - run: python tests/release_smoke.py
      - run: python tests/mpi_train_domain_smoke.py
        env:
          CLIENT_TEST_MPI_ARGS: --oversubscribe
      - run: python -m unittest discover -s tests -p 'test_*.py'
