# The fallback of profiles_aosc_omega_w2_a090.yaml: the same study with CLiENT's older scan, used only if its hybrid scan ends at its 20
# hops with nodes still improving. Its own output directory.
#
# A_osc narrowed from 0.1 to 0.09 (6 November 2026, make_profiles200_narrow.py): with 0.1 the scans put the optimum
# of 31 nodes at the region's edge, and the study would stop after its scan. Replaces profiles_aosc_omega_w2.yaml.
#
# The true 2D profile of PDP+ in (A_osc, omega) for omega <= 200, from the combined emulator of the low part and the five
# zones at their final networks (results/<time>_axion_pp_combined200, network 0). At every node the third
# oscillation parameter and all others are optimised with the true likelihood (CLASS++ 0a57bbc6,
# runs/axion_pp_combined200/job.env). 6 November 2026, make_profiles200.py in results/20261102_high_omega_ladder.
# Window 2 of 4 in omega, [50.75, 100.5].
#
#   sbatch true_profiles/submit_profiles.sh results/<time>_axion_pp_combined200 runs/axion_pp_combined200/fallback/profiles_aosc_omega_w2_a090_legacy.yaml results_profiles/axion_pp200_aosc_omega_w2_a090_legacy --iteration 0
#
# 50 x 50 nodes: A_osc [0, 0.09] in steps of 0.0018, omega in steps of 1.015.
# region: run (the combined region, one cell per part, edge 1.5). Settings as runs/axion_pp_combined's studies.
#
dimension: 2
parameters: [A_osc, omega]
profile_points: 50
ranges:
  A_osc: [0.0, 0.09]
  omega: [50.75, 100.5]
workers: 46                 # backend processes on the node; may be changed when resuming
retrain: false              # the saved network as it is
added_points: 0
surrogate_optimizer: legacy      # the hybrid_* settings below are then not used
maxfun: 150
total_call_budget: 375000   # of the whole study: 2500 nodes at their limit of 150 (maxfun), so it never binds
audit_points: 3             # best saved training values recomputed before anything else
audit_tolerance: 0.01
region: run
hybrid_walkers: 8
hybrid_hops: 20             # hops of the network scan at most (CLiENT's default 12), as the TT studies
seed: 42
