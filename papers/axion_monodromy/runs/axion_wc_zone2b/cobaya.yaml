      min: 0.92
      max: 1.02
    ref: 0.9724
    proposal: 0.004
    drop: true
    latex: n_s
  nrun:
    prior:
      min: -0.1
      max: 0.1
    ref: 0.0
    proposal: 0.007
    drop: true
    latex: '{\rm d}n_s/{\rm d}\ln k'
  tau_reio:
    prior:
      min: 0.01
      max: 0.12
    ref: 0.0621
    proposal: 0.007
