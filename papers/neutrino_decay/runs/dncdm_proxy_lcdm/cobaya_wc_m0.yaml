# LambdaCDM beside the DNCDM proxy, H0WC: nu3 = ncdm_standard m 0 eV (nu3 massless: CLASS++ uses 1e-5 eV).
# Made by runs/dncdm_proxy_lcdm/make_inputs.py from runs/dncdm_proxy_wc/cobaya.yaml (9 November 2026), which says what every other line is; only
# dncdm1.* (now nu3.*), N_ur (+1.0132, the massless nu1) and log10Gamma differ. minimize_lcdm.py adds the sampler and the output.
likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE_sroll2: null
  planck_NPIPE_highl_CamSpec.TTTEEE:
    dataset_params:
      use_cl: 143x143 217x217 143x217 TE EE
      use_range:
        143x143: 30-999
        217x217: 500-999
        143x217: 500-999
        TE: 30-599
        EE: 30-599
  act_lite_trimmed.ACTDR6CMBonlyTrimmed:
    python_path: likelihoods
  candl.interface.CandlCobayaLikelihood:
    data_set_file: spt_candl_data.SPT3G_D1_TnE_lite
    clear_internal_priors: true
    feedback: false
  act_dr6_lenslike.ACTDR6LensLike:
    lens_only: false
    lmax: 4000
    variant: actplanck_baseline
  muse3glike.cobaya.spt3g_2yr_delensed_ee_optimal_pp_muse:
    components:
    - "\u03D5\u03D5"
  bao.desi_dr2.desi_bao_all: null
  sn.pantheonplus: null
theory:
  classy:
    extra_args:
      non_linear: hmcode
      N_ur: 1.0176
      evolver_background: 3
      nu2.type: ncdm_standard
      nu2.m: 0.0087
      nu2.T: 0.71611
      nu2.deg: 1
      radiation_streaming_trigger_tau_over_tau_k: 240
      perturb_sampling_stepsize: 0.05
      l_linstep: 20
      delta_l_max: 1800
      accurate_lensing: 1
      nonlinear_min_k_max: 10
      q_logstep_limber: 1.025
      nu3.type: ncdm_standard
      nu3.T: 0.71611
      nu3.deg: 1
      nu3.quadrature_strategy: 3
      nu3.momenta_bins: 16
      nu3.m: 0
    stop_at_error: false
    renames:
      As: A_s
      ns: n_s
      nrun: alpha_s
      nrunrun: beta_s
      nt: n_t
      ntrun: alpha_t
      rdrag: rs_drag
      omegak: Omega_k
      omegal: Omega_Lambda
      w: w0_fld
      wa: wa_fld
      omegabh2: omega_b
      omegab: Omega_b
      omegach2: omega_cdm
      omegac: Omega_cdm
      omegam: Omega_m
      omegan: Omega_nu
      tau: tau_reio
      zrei: z_reio
      deltazrei: reionization_width
      helium_redshift: helium_fullreio_redshift
      helium_delta_redshift: helium_fullreio_width
      yhe: YHe
      yheused: YHe
      theta_s_100: 100*theta_s
params:
  omega_b:
    prior:
      min: 0.021
      max: 0.0238
    ref: 0.02236
    proposal: 0.00015
    latex: \omega_b
  omega_cdm:
    prior:
      min: 0.11
      max: 0.129
    ref: 0.1185
    proposal: 0.001
    latex: \omega_{\rm cdm}
  H0:
    prior:
      min: 62.0
      max: 74.0
    ref: 67.8
    proposal: 0.5
    latex: H_0
  logA:
    prior:
      min: 2.9
      max: 3.2
    ref: 3.044
    proposal: 0.015
    drop: true
    latex: \ln(10^{10} A_s)
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_s
  n_s:
