# LambdaCDM beside the DNCDM proxy, PDP+: nu3 = ncdm_standard m 0 eV (nu3 massless: CLASS++ uses 1e-5 eV).
# Made by runs/dncdm_proxy_lcdm/make_inputs.py from runs/dncdm_proxy_pp/cobaya.yaml (9 November 2026), which says what every other line is; only
# dncdm1.* (now nu3.*), N_ur (+1.0132, the massless nu1) and log10Gamma differ. minimize_lcdm.py adds the sampler and the output.
likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_NPIPE_highl_CamSpec.TTTEEE: null
  planckpr4lensing.PlanckPR4Lensing: null
  bao.desi_dr2.desi_bao_all: null
  sn.pantheonplus: null
theory:
  classy:
    extra_args:
      non_linear: hmcode
      N_ur: 1.0176
      evolver_background: 3
      nu2.type: ncdm_standard
      nu2.m: 0.0087
      nu2.T: 0.71611
      nu2.deg: 1
      nu3.type: ncdm_standard
      nu3.T: 0.71611
      nu3.deg: 1
      nu3.quadrature_strategy: 3
      nu3.momenta_bins: 16
      nu3.m: 0
    stop_at_error: false
    renames:
      As: A_s
      ns: n_s
      nrun: alpha_s
      nrunrun: beta_s
      nt: n_t
      ntrun: alpha_t
      rdrag: rs_drag
      omegak: Omega_k
      omegal: Omega_Lambda
      w: w0_fld
      wa: wa_fld
      omegabh2: omega_b
      omegab: Omega_b
      omegach2: omega_cdm
      omegac: Omega_cdm
      omegam: Omega_m
      omegan: Omega_nu
      tau: tau_reio
      zrei: z_reio
      deltazrei: reionization_width
      helium_redshift: helium_fullreio_redshift
      helium_delta_redshift: helium_fullreio_width
      yhe: YHe
      yheused: YHe
      theta_s_100: 100*theta_s
params:
  omega_b:
    prior:
      min: 0.021
      max: 0.0238
    ref: 0.02236
    proposal: 0.00015
    latex: \omega_b
  omega_cdm:
    prior:
      min: 0.11
      max: 0.129
    ref: 0.1185
    proposal: 0.001
    latex: \omega_{\rm cdm}
  H0:
    prior:
      min: 62.0
      max: 74.0
    ref: 67.8
    proposal: 0.5
    latex: H_0
  logA:
    prior:
      min: 2.9
      max: 3.2
    ref: 3.044
    proposal: 0.015
    drop: true
    latex: \ln(10^{10} A_s)
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_s
  n_s:
    prior:
      min: 0.92
      max: 1.02
    ref: 0.9665
    proposal: 0.004
    latex: n_s
  tau_reio:
    prior:
      min: 0.01
      max: 0.12
    ref: 0.057
    proposal: 0.007
    latex: \tau_{\rm reio}
  A_planck:
    prior:
      dist: norm
      loc: 1
      scale: 0.0025
    ref:
      dist: norm
      loc: 1
      scale: 0.002
    proposal: 0.0005
    latex: y_{\rm cal}
  amp_143:
    prior:
      min: 0
      max: 50
    ref:
      dist: norm
      loc: 10
      scale: 1
    proposal: 1
    latex: A^{\rm power}_{143}
  amp_217:
    prior:
      min: 0
      max: 50
    ref:
      dist: norm
      loc: 20
      scale: 1
    proposal: 1
    latex: A^{\rm power}_{217}
  amp_143x217:
    prior:
      min: 0
      max: 50
    ref:
      dist: norm
      loc: 10
      scale: 1
    proposal: 1
    latex: A^{\rm power}_{143\times217}
  n_143:
    prior:
      min: 0
      max: 5
    ref:
      dist: norm
      loc: 1
      scale: 0.2
    proposal: 0.2
    latex: \gamma^{\rm power}_{143}
  n_217:
    prior:
      min: 0
      max: 5
    ref:
      dist: norm
      loc: 1
      scale: 0.2
    proposal: 0.2
    latex: \gamma^{\rm power}_{217}
  n_143x217:
    prior:
      min: 0
      max: 5
    ref:
      dist: norm
      loc: 1
      scale: 0.2
    proposal: 0.2
    latex: \gamma^{\rm power}_{143\times217}
  calTE:
    prior:
      dist: norm
      loc: 1
      scale: 0.01
    ref:
      dist: norm
      loc: 1
      scale: 0.01
    proposal: 0.01
    latex: c_{TE}
  calEE:
    prior:
      dist: norm
      loc: 1
      scale: 0.01
    ref:
      dist: norm
      loc: 1
      scale: 0.01
    proposal: 0.01
    latex: c_{EE}
  theta_s_100:
    latex: 100\theta_s
  sigma8:
    latex: \sigma_8
  Omega_m:
    latex: \Omega_\mathrm{m}
