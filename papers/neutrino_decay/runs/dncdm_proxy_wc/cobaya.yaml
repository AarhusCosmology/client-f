# The decaying-neutrino proxy (CLASS++ ncdm_decay_dr, dr_representation = proxy) on H0WC (5 November 2026, Thomas): the
# data of the H0 World Cup papers WITHOUT SH0ES (Paper I arXiv:2607.13282, Paper II arXiv:2607.13283, the baseline "A"),
# with the likelihoods and options of runs/axion_wc_fast and runs/sidr_drmd_wc_low:
#   - Planck PR4 NPIPE CamSpec TTTEEE (Cobaya's, v12.6) cut to l < 1000 in TT and l < 600 in TE and EE; Commander low-l
#     TT and SRoll2 low-l EE;
#   - ACT DR6 ACT-lite (A_act = A_planck) through likelihoods/act_lite_trimmed.py, which asks for C_l to l = 6327
#     instead of 9001 with its chi^2 unchanged to the last bit (CLASSpp #486); SPT-3G D1 T&E lite through candl (its
#     internal priors cleared; Tcal, Ecal here);
#   - CMB lensing: ACT DR6 + Planck PR4 (actplanck_baseline) and SPT-3G MUSE (phiphi only);
#   - DESI DR2 BAO (all tracers) and Pantheon+ (z > 0.01, uncalibrated).
# Installed by install/11_lite_likelihoods.sh dncdm_proxy_wc (pins in env.sh); step 5 finds the trimmed ACT-lite through
# its python_path since 6 November 2026. Before that, 11_lite_likelihoods.sh sidr_drmd_wc_low installs
# the same packages and data (the trimmed ACT-lite reads act_dr6_cmbonly's).
#
# The model, its parameters and their priors are runs/dncdm_proxy_pp's (whose header says what they are), with the
# three nuisances of the small-scale CMB added (P_act, Tcal, Ecal as runs/sidr_drmd_wc_low).
#
# CLASS++ master cb2255f4 (job.env). Precision: the lines of its pre/act_dr6.pre (re-measured in #486 on these four
# small-scale likelihoods), all of them, nonlinear_min_k_max = 10 included; evolver_perturbations and
# tol_perturb_integration at the defaults, as the preset asks. non_linear hmcode, as runs/dncdm_proxy_pp and the H0
# World Cup (HMcode 2020); the preset was measured with halofit and holds for either. l_max_scalars is Cobaya's, from
# the likelihoods' requests (6327 with the trimmed ACT-lite).
# 19 sampled parameters: log10Gamma, six LambdaCDM, nine CamSpec nuisances, P_act, Tcal and Ecal.
likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE_sroll2: null
  planck_NPIPE_highl_CamSpec.TTTEEE:
    dataset_params:
      use_cl: 143x143 217x217 143x217 TE EE
      use_range:                 # l < 1000 in TT, l < 600 in TE and EE (217 and 143x217 start at 500)
        143x143: 30-999
        217x217: 500-999
        143x217: 500-999
        TE: 30-599
        EE: 30-599
  act_lite_trimmed.ACTDR6CMBonlyTrimmed:   # ACT-lite (ACT_LITE_COMMIT, env.sh) asking for C_l to 6327, not 9001
    python_path: likelihoods               # likelihoods/act_lite_trimmed.py; jobs run from this folder
  candl.interface.CandlCobayaLikelihood:
    data_set_file: spt_candl_data.SPT3G_D1_TnE_lite
    clear_internal_priors: true  # its tau and Tcal priors; Tcal's is in params below, tau has none (SPT's SPA file)
    feedback: false
  act_dr6_lenslike.ACTDR6LensLike:
    lens_only: false
    lmax: 4000
    variant: actplanck_baseline
  muse3glike.cobaya.spt3g_2yr_delensed_ee_optimal_pp_muse:
    components: ["ϕϕ"]           # lensing only, not the delensed EE
  bao.desi_dr2.desi_bao_all: null
  sn.pantheonplus: null           # uncalibrated: M_B marginalised analytically
theory:
  classy:
    extra_args:
      non_linear: hmcode
      N_ur: 0.0044                # 3.044 - 3 x 1.0132: nu2, the parent nu3 and the daughter nu1
      evolver_background: 3       # etd; ndf15 fails on the proxy's background
      nu2.type: ncdm_standard
      nu2.m: 0.0087
      nu2.T: 0.71611
      nu2.deg: 1
      dncdm1.type: ncdm_decay_dr
      dncdm1.dr_representation: proxy
      dncdm1.m: 0.05
      dncdm1.T: 0.71611
      dncdm1.deg: 1
      dncdm1.dr_f_ini_l: 1        # the daughter nu1 starts thermally populated ...
      dncdm1.dr_f_ini_phi: 0      # ... and phi empty
      dncdm1.quadrature_strategy: 3   # required with momenta_bins
      dncdm1.momenta_bins: 16         # parent: 12 biases h by -0.11 sigma, 16 by <= 0.03 sigma
      # pre/act_dr6.pre of CLASS++ cb2255f4 (#486), every line:
      radiation_streaming_trigger_tau_over_tau_k: 240
      perturb_sampling_stepsize: 0.05
      l_linstep: 20
      delta_l_max: 1800
      accurate_lensing: 1
      nonlinear_min_k_max: 10
      q_logstep_limber: 1.025
    stop_at_error: false
    renames:
      As: A_s
      ns: n_s
      nrun: alpha_s
      nrunrun: beta_s
      nt: n_t
      ntrun: alpha_t
      rdrag: rs_drag
      omegak: Omega_k
      omegal: Omega_Lambda
      w: w0_fld
      wa: wa_fld
      omegabh2: omega_b
      omegab: Omega_b
      omegach2: omega_cdm
      omegac: Omega_cdm
      omegam: Omega_m
      omegan: Omega_nu
      tau: tau_reio
      zrei: z_reio
      deltazrei: reionization_width
      helium_redshift: helium_fullreio_redshift
      helium_delta_redshift: helium_fullreio_width
      yhe: YHe
      yheused: YHe
      theta_s_100: 100*theta_s
params:
  log10Gamma:
    prior:
      min: -2.0
      max: 14.0
    ref: 6.0
    proposal: 1.0
    drop: true
    latex: \log_{10}(\Gamma\,[\mathrm{km\,s^{-1}\,Mpc^{-1}}])
  dncdm1.log10Gamma:
    value: 'lambda log10Gamma: log10Gamma'
    derived: false
  omega_b:
    prior:
      min: 0.0210
      max: 0.0238
    ref: 0.02236
    proposal: 0.00015
    latex: \omega_b
  omega_cdm:
    prior:
      min: 0.110
      max: 0.129
    ref: 0.1185
    proposal: 0.001
    latex: \omega_{\rm cdm}
  H0:
    prior:
      min: 62.0
      max: 74.0
    ref: 67.8
    proposal: 0.5
    latex: H_0
  logA:
    prior:
      min: 2.90
      max: 3.20
    ref: 3.044
    proposal: 0.015
    drop: true
    latex: \ln(10^{10} A_s)
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_s
  n_s:
    prior:
      min: 0.92
      max: 1.02
    ref: 0.9665
    proposal: 0.004
    latex: n_s
  tau_reio:
    prior:
      min: 0.01
      max: 0.12
    ref: 0.057
    proposal: 0.007
    latex: \tau_{\rm reio}
  A_planck:
    prior:
      dist: norm
      loc: 1
      scale: 0.0025
    ref:
      dist: norm
      loc: 1
      scale: 0.002
    proposal: 0.0005
    latex: y_{\rm cal}
  amp_143:
    prior:
      min: 0
      max: 50
    ref:
      dist: norm
      loc: 10
      scale: 1
    proposal: 1
    latex: A^{\rm power}_{143}
  amp_217:
    prior:
      min: 0
      max: 50
    ref:
      dist: norm
      loc: 20
      scale: 1
    proposal: 1
    latex: A^{\rm power}_{217}
  amp_143x217:
    prior:
      min: 0
      max: 50
    ref:
      dist: norm
      loc: 10
      scale: 1
    proposal: 1
    latex: A^{\rm power}_{143\times217}
  n_143:
    prior:
      min: 0
      max: 5
    ref:
      dist: norm
      loc: 1
      scale: 0.2
    proposal: 0.2
    latex: \gamma^{\rm power}_{143}
  n_217:
    prior:
      min: 0
      max: 5
    ref:
      dist: norm
      loc: 1
      scale: 0.2
    proposal: 0.2
    latex: \gamma^{\rm power}_{217}
  n_143x217:
    prior:
      min: 0
      max: 5
    ref:
      dist: norm
      loc: 1
      scale: 0.2
    proposal: 0.2
    latex: \gamma^{\rm power}_{143\times217}
  calTE:
    prior:
      dist: norm
      loc: 1
      scale: 0.01
    ref:
      dist: norm
      loc: 1
      scale: 0.01
    proposal: 0.01
    latex: c_{TE}
  calEE:
    prior:
      dist: norm
      loc: 1
      scale: 0.01
    ref:
      dist: norm
      loc: 1
      scale: 0.01
    proposal: 0.01
    latex: c_{EE}
  A_act:
    value: 'lambda A_planck: A_planck'
    latex: A_{\rm ACT}
  P_act:
    prior:
      min: 0.9
      max: 1.1
    ref: 1.0
    proposal: 0.01
    latex: p_{\rm ACT}
  Tcal:
    prior:
      dist: norm
      loc: 1.0
      scale: 0.0036
    ref: 1.0
    proposal: 0.005
    latex: T_{\rm cal}
  Ecal:
    prior:
      min: 0.8
      max: 1.2
    ref: 1.0
    proposal: 0.01
    latex: E_{\rm cal}
  theta_s_100:
    latex: 100\theta_s
  sigma8:
    latex: \sigma_8
  Omega_m:
    latex: \Omega_\mathrm{m}
  S8:
    derived: 'lambda sigma8, Omega_m: sigma8*np.sqrt(Omega_m/0.3)'
    latex: S_8
  rs_drag:
    latex: r_\mathrm{drag}
  z_reio:
