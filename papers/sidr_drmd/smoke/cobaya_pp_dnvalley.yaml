# cobaya_pp_dnvalley.yaml: runs/sidr_drmd2_pp_combined_boost10/cobaya.yaml with Delta N_eff in [0, 0.01] (the paper's pp_region_minimise_setup.py, 27 October 2026)
# SIDR + DRMD, second set of runs (21 October 2026): self-interacting massive neutrinos and hot-NEDE
# dark radiation-matter decoupling, on
#   Planck Commander low-l TT + SimAll low-l EE + NPIPE CamSpec TTTEEE + Planck PR4 lensing
#   + DESI DR2 BAO (all tracers) + Pantheon+ (without SH0ES).
# Standard CLASS++ at the kit's pin (7cc41a51). The model as in the first set (runs/sidr_drmd_pp):
# three degenerate interacting neutrinos (each a third of the sum m_int, N_ur 0.00441), no tensors, z_stop
# and G/aH as CLASS++ defines them, f_idm_drmd taken out of omega_cdm (all the dark matter).
#
# Changed from the first set (Steen, 21 October 2026):
#   - the prior IS the training box for every cosmological parameter (domain_bounds.json repeats it),
#     except delta_Neff_drmd, split in two parts (domain splitting, client.py combine);
#   - m_int, the SUM of the three masses: [0.06, 0.3] eV (was [0.0005, 1], boxed at 0.15);
#   - logGeff [-5.5, -0.8] (was a prior to -0.1, boxed at -0.8, as SINU);
#   - f_idm_drmd [0, 0.4] (was [0, 1]: 1 lies in a narrow funnel, LambdaCDM with interacting neutrinos);
#   - omega_b, H0, logA: the first set's training boxes, +-6 sigma of its posteriors, are now the priors;
#   - log10 z_dec recorded as a derived parameter, in place of z_dec (whose tail the derived emulator
#     could not fit).
# Unchanged: omega_cdm [0.079, 0.181], n_s [0.88, 1.06], tau [0.01, 0.1], delta_Neff [0, 2], log10 z_stop
# [2, 5], log10 G/aH [2, 14]; the 9 CamSpec nuisances (A_planck shared with PR4 lensing).
#
# The two parts of this data set, runs/sidr_drmd2_pp_low and runs/sidr_drmd2_pp_high, have
# byte-identical copies of this file, as client.py combine requires: the same objective, the
# training box differing in delta_Neff only.
# 21 sampled parameters.
likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_NPIPE_highl_CamSpec.TTTEEE: null
  planckpr4lensing.PlanckPR4Lensing: null      # pip package, install/06_external_likelihoods.sh
  bao.desi_dr2.desi_bao_all: null
  sn.pantheonplus: null
theory:
  classy:
    extra_args:
      N_ur: 0.00441
      nui1.type: ncdm_self_interacting
      nui1.deg: 3
      nui1.T: 0.71611
      non_linear: halofit        # for the lensing potential (PR4 lensing) and the lensed spectra
                                 # with CLASS++ patched (job.env, install/09_classpp_guard.sh): at points with
                                 # dark acoustic oscillations the unpatched source extrapolation gave NaN spectra
      evolver_perturbations: 1
      tol_perturb_integration: 1.0e-07
    stop_at_error: false
    renames:
      As: A_s
      ns: n_s
      nrun: alpha_s
      nrunrun: beta_s
      nt: n_t
      ntrun: alpha_t
      rdrag: rs_drag
      omegak: Omega_k
      omegal: Omega_Lambda
      w: w0_fld
      wa: wa_fld
      omegabh2: omega_b
      omegab: Omega_b
      omegach2: omega_cdm
      omegac: Omega_cdm
      omegam: Omega_m
      omegan: Omega_nu
      tau: tau_reio
      zrei: z_reio
      deltazrei: reionization_width
      helium_redshift: helium_fullreio_redshift
      helium_delta_redshift: helium_fullreio_width
      yhe: YHe
      yheused: YHe
      theta_s_100: 100*theta_s
params:
  omega_b:
    prior:
      min: 0.0203
      max: 0.0255
    ref: 0.02274
    proposal: 0.0002
    latex: \omega_b
  omega_cdm:
    prior:
      min: 0.079
      max: 0.181
    ref: 0.126
    proposal: 0.003
    latex: \omega_{\rm dm}
  H0:
    prior:
      min: 57.8
      max: 85.0
    ref: 70.5
    proposal: 1.0
    latex: H_0
  logA:
    prior:
      min: 2.80
      max: 3.28
    ref: 3.04
    proposal: 0.015
    drop: true
    latex: \ln(10^{10} A_s)
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_s
  n_s:
    prior:
      min: 0.88
      max: 1.06
    ref: 0.969
    proposal: 0.005
    latex: n_s
  tau_reio:
    prior:
      min: 0.01
      max: 0.1
    ref: 0.056
    proposal: 0.006
    latex: \tau_{\rm reio}
  m_int:
    prior:
      min: 0.06
      max: 0.3
    ref: 0.08
    proposal: 0.01
    drop: true
    latex: \Sigma m_{\nu}\,[{\rm eV}]
  nui1.m:
    value: 'lambda m_int: m_int/3'
    derived: false
  logGeff:
    prior:
      min: -5.5
      max: -0.8
    ref: -4.0
    proposal: 0.2
    drop: true
    latex: \log_{10}(G_{\rm eff}\,{\rm MeV}^2)
  nui1.log10G_eff:
    value: 'lambda logGeff: logGeff'
    derived: false
  delta_Neff_drmd:
    prior:
      min: 0.0
      max: 0.01
    ref: 0.37
    proposal: 0.1
    latex: \Delta N_{\rm eff}
  f_idm_drmd:
    prior:
      min: 0.0
      max: 0.4
    ref: 0.012
    proposal: 0.005
    latex: f_{\rm idm}
  log10_zstop:
    prior:
      min: 2.0
      max: 5.0
    ref: 4.0
    proposal: 0.2
    drop: true
    latex: \log_{10} z_{\rm stop}
  z_stop:
    value: 'lambda log10_zstop: 10**log10_zstop'
    derived: false
  log10_G_over_aH:
    prior:
      min: 2.0
      max: 14.0
    ref: 7.3
    proposal: 0.5
    drop: true
    latex: \log_{10}(G/aH)
  G_over_aH_drmd_ini:
    value: 'lambda log10_G_over_aH: 10**log10_G_over_aH'
    derived: false
  A_planck:
    prior:
      dist: norm
      loc: 1
      scale: 0.0025
    ref:
      dist: norm
      loc: 1
      scale: 0.002
    proposal: 0.0005
    latex: y_{\rm cal}
  amp_143:
    prior:
      min: 0
      max: 50
    ref:
      dist: norm
      loc: 10
      scale: 1
    proposal: 1
    latex: A^{\rm power}_{143}
  amp_217:
    prior:
      min: 0
      max: 50
    ref:
      dist: norm
      loc: 20
      scale: 1
    proposal: 1
    latex: A^{\rm power}_{217}
  amp_143x217:
    prior:
      min: 0
      max: 50
    ref:
      dist: norm
      loc: 10
      scale: 1
    proposal: 1
    latex: A^{\rm power}_{143\times217}
  n_143:
    prior:
      min: 0
      max: 5
    ref:
      dist: norm
      loc: 1
      scale: 0.2
    proposal: 0.2
    latex: \gamma^{\rm power}_{143}
  n_217:
    prior:
      min: 0
      max: 5
    ref:
      dist: norm
      loc: 1
      scale: 0.2
    proposal: 0.2
    latex: \gamma^{\rm power}_{217}
  n_143x217:
    prior:
      min: 0
      max: 5
    ref:
      dist: norm
      loc: 1
      scale: 0.2
    proposal: 0.2
    latex: \gamma^{\rm power}_{143\times217}
  calTE:
    prior:
      dist: norm
      loc: 1
      scale: 0.01
    ref:
      dist: norm
      loc: 1
      scale: 0.01
    proposal: 0.01
    latex: c_{TE}
  calEE:
    prior:
      dist: norm
      loc: 1
      scale: 0.01
    ref:
      dist: norm
      loc: 1
      scale: 0.01
    proposal: 0.01
    latex: c_{EE}
  theta_s_100:
    latex: 100\theta_s
  sigma8:
    latex: \sigma_8
  Omega_m:
    latex: \Omega_\mathrm{m}
  S8:
    derived: 'lambda sigma8, Omega_m: sigma8*np.sqrt(Omega_m/0.3)'
    latex: S_8
  rs_drag:
    latex: r_\mathrm{drag}
  z_reio:
    latex: z_\mathrm{reio}
  Neff:
    latex: N_\mathrm{eff}
  f_idr_drmd:
    latex: f_\mathrm{idr}
  log10_zdec:
    derived: 'lambda z_dec_drmd: np.log10(z_dec_drmd)'
    latex: \log_{10}z_\mathrm{dec}
