      max: 0.181
    ref: 0.126
    proposal: 0.003
    latex: \omega_{\rm dm}
  H0:
    prior:
      min: 57.8
      max: 85.0
    ref: 70.5
    proposal: 1.0
    latex: H_0
  logA:
    prior:
      min: 2.80
      max: 3.28
    ref: 3.04
    proposal: 0.015
    drop: true
    latex: \ln(10^{10} A_s)
  A_s:
