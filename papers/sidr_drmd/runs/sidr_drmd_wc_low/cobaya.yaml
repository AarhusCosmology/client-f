# SIDR + DRMD on the data of the H0 World Cup papers (Paper I arXiv:2607.13282, Paper II arXiv:2607.13283), WITHOUT SH0ES (the World Cup's baseline "A").
# Made 23 October 2026 by results/20261023_wc_runs/make_runs.py from runs/sidr_drmd2_pp_low (Steen: the same
# cosmological model and priors as the earlier runs, which these complement, not replace).
#
# The data, as the World Cup's baseline CMB+BAO+SN ("A"):
#   - Planck PR4 NPIPE CamSpec TTTEEE (Cobaya's, v12.6; the World Cup names v12.7), cut to l < 1000 in TT and l < 600
#     in TE and EE: ACT's P-ACT cut, and the World Cup Paper I's (Paper II writes "l<1000 in TT,TE");
#   - Planck low-l TT (Commander) and SRoll2 low-l EE;
#   - ACT DR6 ACT-lite (foreground-marginalised; the package's default TT/TE/EE 600-6500), its calibration tied to
#     Planck's (A_act = A_planck, as ACT's P-ACT and SPT's SPA files do), with A_planck's CamSpec prior only;
#   - SPT-3G D1 T&E lite through candl, its internal priors cleared and Tcal, Ecal given here (SPT's SPA file);
#   - CMB lensing: ACT DR6 + Planck PR4 (act_dr6_lenslike, variant actplanck_baseline) and SPT-3G 2019-2020 MUSE
#     (phiphi only); SPT's own combination of the two (muselens_actplanckbaselens);
#   - DESI DR2 BAO, all tracers; Pantheon+ (z > 0.01), uncalibrated.
# Installed by install/11_lite_likelihoods.sh (pins in env.sh).
#
# CLASS++ master bfe6729e (22 October 2026), unpatched: install/10_classpp_build.sh, job.env. Its own fix (#467)
# replaces our extrapolation guard. Precision:
# - pre/act_dr6.pre's lines (ACT DR6 to l = 8500, tuned on ACT-lite) without its nonlinear_min_k_max = 70, with which
#   a SIDR + DRMD point did not finish in 45 minutes (results/20261023_classpp_act_preset_timing);
# - nonlinear_min_k_max = 10: the continuation past the default 2/Mpc (#470) is off at dark acoustic oscillations (C_L^phiphi by up to 9%; make_runs.py);
# - halofit, as the earlier runs, and their evolver_perturbations 1 and tol_perturb_integration 1e-7;
# - l_max_scalars is Cobaya's, from ACT-lite's 9000.
#
# The two parts of this data set, runs/sidr_drmd_wc_low and runs/sidr_drmd_wc_high, have byte-identical copies of this file,
# as client.py combine requires: the same objective, the training box differing in delta_Neff only.
# 24 sampled parameters: the second set's 21 and P_act, Tcal, Ecal.
likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE_sroll2: null
  planck_NPIPE_highl_CamSpec.TTTEEE:
    dataset_params:
      use_cl: 143x143 217x217 143x217 TE EE
      use_range:                 # l < 1000 in TT, l < 600 in TE and EE (217 and 143x217 start at 500)
        143x143: 30-999
        217x217: 500-999
        143x217: 500-999
        TE: 30-599
        EE: 30-599
  act_dr6_cmbonly: null          # ACT-lite, DR6-ACT-lite at ACT_LITE_COMMIT (env.sh)
  candl.interface.CandlCobayaLikelihood:
    data_set_file: spt_candl_data.SPT3G_D1_TnE_lite
    clear_internal_priors: true  # its tau and Tcal priors; Tcal's is in params below, tau has none (SPT's SPA file)
    feedback: false
  act_dr6_lenslike.ACTDR6LensLike:
    lens_only: false
    lmax: 4000
    variant: actplanck_baseline
  muse3glike.cobaya.spt3g_2yr_delensed_ee_optimal_pp_muse:
    components: ["ϕϕ"]           # lensing only, not the delensed EE
  bao.desi_dr2.desi_bao_all: null
  sn.pantheonplus: null           # uncalibrated: M_B marginalised analytically
theory:
  classy:
    extra_args:
      N_ur: 0.00441
      nui1.type: ncdm_self_interacting
      nui1.deg: 3
      nui1.T: 0.71611
      non_linear: halofit        # as the earlier runs (ACT, SPT and their likelihoods' authors use HMcode 2020)
      evolver_perturbations: 1
      tol_perturb_integration: 1.0e-07
      nonlinear_min_k_max: 10   # modes solved to this k (1/Mpc) for halofit: the dark acoustic oscillations (make_runs.py)
      # pre/act_dr6.pre of CLASS++ bfe6729e, every line but nonlinear_min_k_max = 70:
      delta_l_max: 1800
      accurate_lensing: 1
      radiation_streaming_trigger_tau_over_tau_k: 240
      l_linstep: 20
      perturb_sampling_stepsize: 0.05
      l_max_ur: 35
      ur_fluid_trigger_tau_over_tau_k: 130
      q_logstep_limber: 1.025
      neglect_CMB_sources_below_visibility: 0.0001
      ncdm_fluid_trigger_tau_over_tau_k: 15
      l_max_ncdm: 10
      tol_ncdm_synchronous: 0.03
      transfer_neglect_delta_k_S_t0: 0.15
      transfer_neglect_delta_k_S_t1: 0.04
      transfer_neglect_delta_k_S_t2: 0.12
      transfer_neglect_delta_k_S_e: 1
      transfer_neglect_l_half_S_t0: 0
      transfer_neglect_l_half_S_t1: 0
      transfer_neglect_l_half_S_t2: 0
      transfer_neglect_l_half_S_e: 0
    stop_at_error: false
    renames:
      As: A_s
      ns: n_s
      nrun: alpha_s
      nrunrun: beta_s
      nt: n_t
      ntrun: alpha_t
      rdrag: rs_drag
      omegak: Omega_k
      omegal: Omega_Lambda
      w: w0_fld
      wa: wa_fld
      omegabh2: omega_b
      omegab: Omega_b
      omegach2: omega_cdm
      omegac: Omega_cdm
      omegam: Omega_m
      omegan: Omega_nu
      tau: tau_reio
      zrei: z_reio
      deltazrei: reionization_width
      helium_redshift: helium_fullreio_redshift
      helium_delta_redshift: helium_fullreio_width
      yhe: YHe
      yheused: YHe
      theta_s_100: 100*theta_s
