# LambdaCDM: Planck Commander low-l TT + low-l EE (SimAll) + NPIPE CamSpec TTTEEE + DESI DR2 BAO (all tracers), CLASS++.
# packages_path is left out, so that Cobaya uses $COBAYA_PACKAGES_PATH.
# Massless neutrinos, N_eff = 3.045; H0 sampled; no lensing likelihood.
# 15 sampled parameters: 6 cosmological + 9 CamSpec nuisances. The training box is domain_bounds.json.
likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_NPIPE_highl_CamSpec.TTTEEE: null
  bao.desi_dr2.desi_bao_all: null
theory:
  classy:
    extra_args:
      N_ncdm: 0
      N_ur: 3.045
      evolver_perturbations: 1
      tol_perturb_integration: 1.0e-07
    renames:
      As: A_s
      ns: n_s
      nrun: alpha_s
      nrunrun: beta_s
      nt: n_t
      ntrun: alpha_t
      rdrag: rs_drag
      omegak: Omega_k
      omegal: Omega_Lambda
      w: w0_fld
      wa: wa_fld
      omegabh2: omega_b
      omegab: Omega_b
      omegach2: omega_cdm
      omegac: Omega_cdm
      omegam: Omega_m
      omegan: Omega_nu
      tau: tau_reio
      zrei: z_reio
      deltazrei: reionization_width
      helium_redshift: helium_fullreio_redshift
      helium_delta_redshift: helium_fullreio_width
      yhe: YHe
      yheused: YHe
      theta_s_100: 100*theta_s
params:
  omega_b:
    prior:
      min: 0.005
      max: 0.1
    ref: 0.022377
    proposal: 0.00015
    latex: \omega_b
  omega_cdm:
    prior:
      min: 0.001
      max: 0.99
    ref: 0.1201
    proposal: 0.0013
    latex: \omega_{cdm}
  H0:
    prior:
      min: 50.0
      max: 90.0
    ref: 67.4
    proposal: 1.0
    latex: H_0
  logA:
    prior:
      min: 1.61
      max: 3.91
    ref: 3.0447
    proposal: 0.015
    drop: true
    latex: \ln(10^{10} A_s)
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_s
  n_s:
    prior:
      min: 0.8
      max: 1.2
    ref: 0.9659
    proposal: 0.0042
    latex: n_s
  tau_reio:
    prior:
      min: 0.004
      max: 0.8
    ref: 0.0543
    proposal: 0.008
    latex: \tau_{reio}
  A_planck:
    prior:
      dist: norm
      loc: 1
      scale: 0.0025
    ref:
      dist: norm
      loc: 1
      scale: 0.002
    proposal: 0.0005
    latex: y_{\rm cal}
  amp_143:
    prior:
      min: 0
      max: 50
    ref:
      dist: norm
      loc: 10
      scale: 1
    proposal: 1
    latex: A^{\rm power}_{143}
  amp_217:
    prior:
      min: 0
      max: 50
    ref:
      dist: norm
      loc: 20
      scale: 1
    proposal: 1
    latex: A^{\rm power}_{217}
  amp_143x217:
    prior:
      min: 0
      max: 50
    ref:
      dist: norm
      loc: 10
      scale: 1
    proposal: 1
    latex: A^{\rm power}_{143\times217}
  n_143:
    prior:
      min: 0
      max: 5
    ref:
      dist: norm
      loc: 1
      scale: 0.2
    proposal: 0.2
    latex: \gamma^{\rm power}_{143}
  n_217:
    prior:
      min: 0
      max: 5
    ref:
      dist: norm
      loc: 1
      scale: 0.2
    proposal: 0.2
    latex: \gamma^{\rm power}_{217}
  n_143x217:
    prior:
      min: 0
      max: 5
    ref:
      dist: norm
      loc: 1
      scale: 0.2
    proposal: 0.2
    latex: \gamma^{\rm power}_{143\times217}
  calTE:
    prior:
      dist: norm
      loc: 1
      scale: 0.01
    ref:
      dist: norm
      loc: 1
      scale: 0.01
    proposal: 0.01
    latex: c_{TE}
  calEE:
    prior:
      dist: norm
      loc: 1
      scale: 0.01
    ref:
      dist: norm
      loc: 1
      scale: 0.01
    proposal: 0.01
    latex: c_{EE}
  theta_s_100:
    latex: 100\theta_s
  sigma8:
    latex: \sigma_8
  Omega_m:
    latex: \Omega_\mathrm{m}
  S8:
    derived: 'lambda sigma8, Omega_m: sigma8*np.sqrt(Omega_m/0.3)'
    latex: S_8
  Omega_Lambda:
    latex: \Omega_\Lambda
  z_reio:
    latex: z_\mathrm{reio}
  rs_drag:
    latex: r_\mathrm{drag}
