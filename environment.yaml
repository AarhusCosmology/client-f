# The versions CLiENT was developed and validated with.
#
# The analytic targets (input/cobaya/banana_function.py and the inline Gaussians) need no
# Boltzmann solver: CLASS, clik and MontePython are required only for the real-data
# likelihoods.
channels:
  - conda-forge
  - defaults

dependencies:
  # core
  - python=3.10.18
  - numpy=2.0.2
  - pandas=2.3.3
  - scipy=1.15.3
  - scikit-learn=1.7.1
  - pyyaml=6.0.2
  - cython=3.1.4

  # sampling and chain I/O
  - emcee=3.1.6
  - h5py=3.14.0
  - tqdm=4.67.1  # the sampler's progress bar; it used to arrive only with Cobaya

  # benchmarking and plots
  - matplotlib=3.10.5
  - getdist=1.7.1

  - pip=25.2
  - pip:
    - tensorflow==2.19.0
    - keras==3.12.4  # TensorFlow asks only for >= 3.5; a saved network needs the Keras line it was written with
    - cobaya==3.6.2
