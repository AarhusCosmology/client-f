# The settings recommended for near-Gaussian likelihoods, such as cosmological parameter estimation
# of the Planck kind (docs/boost.md, "Two recommended settings"). Most of them are not defaults.
# On a 27-parameter analytic Gaussian, which needs no Boltzmann code; for a real likelihood change
# likelihood.input and the sizes below.
#
#   python client.py input/recommended_near_gaussian.yaml -n near_gaussian
#
# The ordinary loop runs until the scatter of network minus truth at its tempered batch has been
# below 1.2 T for two networks running, then ten boosts follow and the run ends.
likelihood:
  wrapper: cobaya
  input: input/cobaya/gaussian_planck.yaml
prior:
  n_samples: 3000
  sampling_strategy: lhs
  n_sigma: 10.0
  n_inject: 100
acquisition:
  n_append: 3000
  pool_factor: 20
  n_neighbors: 20
  target_temperature: 7.0
  n_inject: 100               # fitted to the points near the best
  audit: {}                   # the audit's defaults (docs/audit_optima.md)
  boost:
    n: 3000                   # posterior points per boost
    start_iteration: 30       # at the latest: the boosts begin when the ordinary loop has converged
    boosts: 10
    density_filter: true      # docs/posterior_density_boost.md
    pool_factor: 20
    background: quadratic     # docs/boost_background_region.md
    region: 2.0
model:
  n_layers: 5
  n_neurons: 512
  activation: alsing
training:
  n_epochs: 5000
  batch_size: 128
  loss: msre
  sigma_level: 3
  msre_ess_floor: 0.1
  learning_rate: 0.0001
  validation_split: 0.1
  patience: 250               # unused with lr_schedule: plateau
  lr_schedule: plateau        # not the default; all real runs so far have used it
  lr_factor: 0.3
  lr_patience: 75
  lr_min: 1.0e-06
  lr_grace: 100
  warm_start: true
sampling:
  sampler: aies
  temperature: 7.0
  n_walkers: 432
  n_steps: 60000
  burn_in: 5000
  thin: 5
  chunk_size: 1000
convergence:
  metric: tempered_batch_scatter  # docs/tempered_convergence.md
  threshold: 1.2                  # in units of sampling.temperature
  consecutive: 2
  max_iterations: 41              # at most 30 of the ordinary loop and ten boosts
seed: 42
derived:
  inputs: auto
